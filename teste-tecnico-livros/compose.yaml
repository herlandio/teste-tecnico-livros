services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: livros_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - livros_network

  nginx:
    image: nginx:1.27-alpine
    container_name: livros_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - livros_network

  postgres:
    image: postgres:16-alpine
    container_name: livros_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: livros
      POSTGRES_USER: livros_user
      POSTGRES_PASSWORD: livros_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U livros_user -d livros" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - livros_network

  vite:
    image: node:22-alpine
    container_name: livros_vite
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www/html
    networks:
      - livros_network

volumes:
  postgres_data:

networks:
  livros_network:
    driver: bridge
